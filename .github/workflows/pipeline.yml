# StudySpace pipeline with the CI-15 quality dashboard. MIT709 Week 8.
# Move this file to .github/workflows/pipeline.yml
name: StudySpace pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and quality dashboard (CI-15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the tools
        run: pip install -r requirements.txt

      - name: Lint (Ruff)
        id: lint
        continue-on-error: true
        run: ruff check .

      - name: Tests (pytest)
        id: tests
        continue-on-error: true
        run: pytest -q

      - name: Simulated load (telemetry)
        run: python simulate_load.py

      - name: AI-assisted outcomes
        run: python analyse_outcomes.py commit-history.csv

      - name: Write the dashboard to the Summary page
        env:
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: python dashboard.py >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if lint or tests failed
        if: steps.lint.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
